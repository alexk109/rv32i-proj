# Check generation for cpu_pipeline_top, consumed by riscv-formal's
# genchecks.py (tools/riscv-formal/checks/). genchecks must run from inside
# <riscv-formal>/cores/<name>/, so `make formal-gen` stages this file and
# wrapper.sv into tools/riscv-formal/cores/cpu_pipeline/ before running it.
#
# @@ROOT@@ and @@SLANG@@ below are substituted by `make formal-gen` (see
# Makefile) with this repo's path and the yosys-slang plugin path. Keeping
# them as placeholders here, rather than baked-in absolute paths, is what
# lets this file work after a fresh clone + tools/setup.sh on any machine.
#
# Usage: make formal-gen && make formal-run

[options]
isa rv32i
solver yices

# bmc: no counterexample within `depth` cycles. prove: k-induction (unbounded).
# Override: make formal-gen FORMAL_MODE=prove
mode bmc

# Depth must clear fetch-to-retirement latency (5 stages, plus a stall or
# flush) or BMC never reaches an instruction's WB and every check passes
# vacuously.
[depth]
insn         15
# reg tracks a register across TWO retirements, so it's by far the most
# expensive check. Measured against check cycle: 14->52s, 16->32s,
# 18->no result in 5min, 20->no result in 20min. The cliff between 16 and 18
# is sharp; 16 is the deepest that reliably terminates. Editing depth/skip in
# a GENERATED .sby instead of here is a no-op: RISCV_FORMAL_CHECK_CYCLE stays
# at the old value and the check cycle is never reached, so it passes vacuously.
reg     10   16
pc_fwd  10   20
pc_bwd  10   20
unique   1 5 20
causal  10   20
cover    1   20

[defines]
`define RVFI
`define RISCV_FORMAL

# mem_addr is reported as an aligned word address with a shifted mask, which
# is the ALIGNED_MEM convention. It also means the specs require a trap on
# misaligned LH/LW/SH/SW -- see the trap logic in cpu_pipeline_top.sv.
`define RISCV_FORMAL_ALIGNED_MEM

# Vacuity guard: if the harness could never retire instructions, every check
# would pass trivially. No external stall input means the core retires every
# cycle once the pipe fills, hence >= 2 rather than nerv's exact == 2.
[cover]
always @* if (!reset) cover (channel[0].cnt_insns >= 2);

# mode prove turns trig/check into free inputs with no ordering between them,
# so the solver can pick check=1 with trig never set -- which makes
# rvfi_unique_check's `(!trig || ...)` term treat the chosen instruction as a
# duplicate of itself (a false unique_ch0 failure). These assumptions only
# constrain the harness's own scheduling signals, restoring what BMC gives
# for free: trig fires once, strictly before check.
[assume !.*]
`ifdef RISCV_FORMAL_UNBOUNDED
`ifdef RISCV_FORMAL_TRIG_CYCLE
  reg trig_seen = 0;
  always @(posedge clock) begin
    if (reset) trig_seen <= 1'b0;
    else if (trig) trig_seen <= 1'b1;
  end
  always @* if (!reset) begin
    assume (!(trig && trig_seen));
`ifdef RISCV_FORMAL_CHECK_CYCLE
    assume (!check || trig_seen);
`endif
  end
`endif
`endif

# The core goes through yosys-slang, not the built-in `read -sv` genchecks
# uses. Yosys's own SV frontend rejects `module X import pkg::*;` headers and
# can't resolve a type from one package inside another (pipe_pkg needs
# ctrl_pkg::ctrl_t). script-defines runs before `read -sv`, so the core is
# already elaborated by the time the generated check file is read; yosys
# links them by name at `prep`.
[script-defines]
plugin -i @@SLANG@@
read_slang --keep-hierarchy -DRVFI -DRISCV_FORMAL \
  @@ROOT@@/design/pkg/riscv_pkg.sv \
  @@ROOT@@/design/pkg/ctrl_pkg.sv \
  @@ROOT@@/design/pkg/pipe_pkg.sv \
  @@ROOT@@/design/src/alu.sv \
  @@ROOT@@/design/src/branch_cmp.sv \
  @@ROOT@@/design/src/decoder.sv \
  @@ROOT@@/design/src/imm_gen.sv \
  @@ROOT@@/design/src/next_pc.sv \
  @@ROOT@@/design/src/reg_file.sv \
  @@ROOT@@/design/src/predictors/predictor_gshare.sv \
  @@ROOT@@/design/cpu_core.sv \
  @@ROOT@@/verif/rvfi_monitor.sv \
  @@ROOT@@/verif/rvfi_bind.sv \
  @@ROOT@@/verif/formal/mem_responder.sv \
  @@ROOT@@/verif/formal/invariants.sv

# The abc engine works on an AIG, which can't represent x/z, so undriven bits
# need resolving first. -anyseq (not -zero) keeps this an over-approximation
# rather than a silent constraint. smtbmc tolerates x natively, so this only
# matters once `abc pdr` is in FORMAL_ENGINES.
[script-link]
setundef -undriven -anyseq

# Only the wrapper goes through the built-in frontend, alongside the
# generated check file -- it needs the RVFI_* macros that file defines.
[verilog-files]
@basedir@/cores/@core@/wrapper.sv
