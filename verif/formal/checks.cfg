# riscv-formal check generation for cpu_pipeline_top.
#
# Consumed by riscv-formal/checks/genchecks.py, which emits one .sby file per
# property into checks/. genchecks derives the core name from its working
# directory and basedir from ../.., so it must run from inside
# <riscv-formal>/cores/<name>/ -- `make formal-gen` stages this directory there.
#
# Run `make formal-gen` then `make formal-run` from the repo root.

[options]
isa rv32i
solver yices

# Depth has to exceed the number of pipeline stages between fetch and retirement,
# otherwise BMC unrolls too few cycles for an instruction to reach WB and every
# check passes vacuously. This core retires in WB, 5 stages deep, and a load-use
# stall or a misprediction flush adds cycles on top -- hence the headroom.
[depth]
insn         15
reg     10   20
pc_fwd  10   20
pc_bwd  10   20
unique   1 5 20
causal  10   20
cover    1   20

[defines]
# The core gates its whole RVFI port block behind `RVFI`; RISCV_FORMAL alone is
# not enough to expose it.
`define RVFI
`define RISCV_FORMAL

# The core reports mem_addr as an aligned word address with a shifted rmask/wmask,
# which is the ALIGNED_MEM convention. Note this makes the specs require a trap on
# misaligned LH/LW/SH/SW -- which this core does not implement. See README.
`define RISCV_FORMAL_ALIGNED_MEM

# Guards against a vacuous pass: if the harness could never retire instructions,
# every other check would pass trivially. Cover is evaluated only at the final
# step (genchecks emits `skip <depth>`), and this core has no external stall input,
# so it retires every cycle once the pipe fills -- hence `>= 2` rather than the
# `== 2` that cores like nerv can hit exactly.
[cover]
always @* if (!reset) cover (channel[0].cnt_insns >= 2);

# The core is read by yosys-slang, not the built-in `read -sv` that genchecks
# emits. Yosys's own SystemVerilog frontend cannot handle this design: it rejects
# `module X import pkg::*;` headers and cannot resolve a type declared in one
# package from inside another (pipe_pkg needs ctrl_pkg::ctrl_t). script-defines is
# emitted ahead of the `read -sv` line, so the core modules already exist by the
# time the generated check and the wrapper are read; yosys links them by name at
# `prep`.
[script-defines]
plugin -i /home/alex4/projects/tools/yosys-slang/build/slang.so
read_slang --keep-hierarchy -DRVFI -DRISCV_FORMAL \
  /home/alex4/projects/cpu-project/design/pkg/riscv_pkg.sv \
  /home/alex4/projects/cpu-project/design/pkg/ctrl_pkg.sv \
  /home/alex4/projects/cpu-project/design/pkg/pipe_pkg.sv \
  /home/alex4/projects/cpu-project/design/src/alu.sv \
  /home/alex4/projects/cpu-project/design/src/branch_cmp.sv \
  /home/alex4/projects/cpu-project/design/src/data_mem.sv \
  /home/alex4/projects/cpu-project/design/src/decoder.sv \
  /home/alex4/projects/cpu-project/design/src/imm_gen.sv \
  /home/alex4/projects/cpu-project/design/src/instr_mem.sv \
  /home/alex4/projects/cpu-project/design/src/next_pc.sv \
  /home/alex4/projects/cpu-project/design/src/reg_file.sv \
  /home/alex4/projects/cpu-project/design/src/predictors/predictor_gshare.sv \
  /home/alex4/projects/cpu-project/design/cpu_pipeline_top.sv

# Only the wrapper goes through the built-in frontend, alongside the generated
# check file -- it needs the RVFI_* macros that the check file defines.
[verilog-files]
@basedir@/cores/@core@/wrapper.sv
